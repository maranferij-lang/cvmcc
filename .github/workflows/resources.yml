name: Resource link health

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Minimal permissions by default; writing is allowed only in the job "pr"
permissions:
  contents: read

concurrency:
  group: resources-link-health
  cancel-in-progress: false

jobs:
  check:
    # Read-only: the repository code runs here and nothing is pushed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check links
        # Exit code 3 means more than 20 percent of resources would be hidden: the job fails and no PR is opened
        run: python scripts/check_links.py
      - name: Upload link status
        uses: actions/upload-artifact@v4
        with:
          name: link-status
          path: cvmax/resources/link_status.json
          if-no-files-found: error

  pr:
    # Write-only: no repository code runs here, we only unpack the artifact and open the PR
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: link-status
          path: link-status-artifact
      - name: Place the status file
        run: cp link-status-artifact/link_status.json cvmax/resources/link_status.json
      - name: Open pull request
        # No file change means no pull request. Never merged automatically: the owner reviews and merges by hand.
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT is needed so the PR triggers tests.yml (GITHUB_TOKEN does not do this)
          token: ${{ secrets.LEARN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: "resources/links-${{ github.run_id }}"
          commit-message: "Weekly resource link check"
          title: "Weekly resource link check"
          body: |
            Result of the weekly link check (`scripts/check_links.py`).

            A resource is hidden in the app after 2 consecutive failures (404, 410, DNS or connection errors).
            403, 429, 5xx and timeouts count as unknown and change nothing. Review the diff of
            `cvmax/resources/link_status.json` and merge by hand.
          add-paths: |
            cvmax/resources/link_status.json
