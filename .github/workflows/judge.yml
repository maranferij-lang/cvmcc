name: Weekly judge

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Minimal permissions by default; writing is allowed only in the job "pr"
permissions:
  contents: read

jobs:
  judge:
    # Read-only: the repository code runs here, with the database and model secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Judge opted-in samples
        run: python scripts/judge.py --days 7 --limit 20
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CVMAX_LEARN_TOKEN: ${{ secrets.CVMAX_LEARN_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CVMAX_PROVIDER: ${{ vars.CVMAX_PROVIDER }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: judge-report
          path: docs/judge
          if-no-files-found: error

  pr:
    # Write-only: no repository code runs here, we only unpack the artifact and open the PR
    needs: judge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: judge-report
          path: docs/judge
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT is needed so the PR triggers tests.yml (GITHUB_TOKEN does not do this)
          token: ${{ secrets.LEARN_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: "judge/${{ github.run_id }}"
          commit-message: "Weekly judge report"
          title: "Weekly judge report"
          body: "Counts only, no CV text. Review the findings in the database; export cases locally with scripts/judge.py --export-cases. Merge by hand."
          add-paths: |
            docs/judge/*.md
