[server]
enableStaticServing = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
# Without base: the app takes the light or dark theme from the user's system.
font = "Schibsted Grotesk, Helvetica Neue, Arial, sans-serif"
headingFont = "Schibsted Grotesk, Helvetica Neue, Arial, sans-serif"
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true

[theme.light]
primaryColor = "#E0261B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F5"
textColor = "#15171C"
linkColor = "#15171C"
borderColor = "#D9DADC"

[theme.dark]
primaryColor = "#FF4B3E"
backgroundColor = "#121418"
secondaryBackgroundColor = "#1B1E23"
textColor = "#F3F2EE"
linkColor = "#F3F2EE"
borderColor = "#34373D"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-latin.woff2"
weight = "400 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/SchibstedGrotesk-latin-ext.woff2"
weight = "400 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"
